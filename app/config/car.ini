; UTF-8；车载终端配置
[ui]
font=/opt/car-terminal/fonts/wqy-microhei.ttc
[music]
; 只扫描这个目录下的 WAV，不递归子目录。
directory=/opt/car-terminal/music
[audio]
card=0
device="hw:0,0"
; 0～100，amixer -M 听感映射，默认60%。
volume_percent=60
[sensors]
ap_device=/dev/ap3216c
imu_device=/dev/icm20608

[weather]
; 修改城市时同时修改经纬度。不是 GPS 自动定位。
city=长沙
latitude=28.2282
longitude=112.9388
refresh_minutes=15
curl=/opt/weather-tools/bin/curl
library=/opt/weather-tools/lib
ca=/opt/weather-tools/certs/ca-certificates.crt
